services:
  bookmark-nav:
    # 使用 GitHub Container Registry 镜像
    image: ghcr.io/zj-zhangcn/bookmarks:latest
    # 如需本地构建，取消注释下面一行并注释上面的 image
    # build: .
    container_name: bookmark-nav
    ports:
      - "8080:3000"
    volumes:
      # SQLite 数据持久化
      - bookmark-data:/app/backend/data
    restart: unless-stopped
    # 推荐：将敏感信息写入同目录的 .env（不要提交到 Git）
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # 固定到持久化卷，避免 .env 中的相对路径落到容器临时文件系统
      - DB_PATH=/app/backend/data/bookmarks.db
      # =====================
      # 鉴权（推荐配置）
      # =====================
      # 访问控制：anonymous / token / session / off
      - AUTH_MODE=anonymous
      # 管理员令牌（AUTH_MODE=token 时写操作需要 Authorization: Bearer ***）
      # - ADMIN_TOKEN=your-secret-token
      # 内置登录（AUTH_MODE=session）时配置以下变量，密码和密钥请写入同目录 .env
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=your-password
      # - AUTH_SESSION_SECRET=your-long-random-secret
      # - AUTH_COOKIE_SECURE=true
      # =====================
      # 安全（可选）
      # =====================
      # 允许访问内网地址（WebDAV 同步到 NAS 或内网 AI 网关时需要）
      # - ALLOW_PRIVATE_NETWORK=true
      # CORS 允许的源（多个用逗号分隔，不设置则允许所有）
      # - CORS_ORIGIN=https://example.com
      # SQLite 每日备份默认开启并保留 14 份；完整恢复前备份默认保留 5 份
      # - DB_DAILY_BACKUP_ENABLED=true
      # - DB_DAILY_BACKUP_LIMIT=14
      # - DB_RESTORE_BACKUP_LIMIT=5
      # 可选：启用服务端 WebDAV 异地 SQLite 备份
      # - DB_OFFSITE_BACKUP_ENABLED=true
      # - DB_OFFSITE_BACKUP_PROVIDER=webdav
      # - DB_OFFSITE_WEBDAV_URL=https://dav.example.com/dav/
      # - DB_OFFSITE_WEBDAV_USERNAME=your-user
      # - DB_OFFSITE_WEBDAV_PASSWORD=your-app-password
      # - DB_OFFSITE_WEBDAV_PATH=bookmarks/sqlite-backups/
      # - DB_OFFSITE_BACKUP_LIMIT=30
      # =====================
      # AI（可选，默认关闭）
      # =====================
      # - AI_ENABLED=true
      # - AI_PROVIDER=openai            # openai / gemini / claude
      # - AI_MODEL=gpt-4o-mini
      # - AI_BASE_URL=https://api.openai.com/v1
      # - AI_TIMEOUT_MS=8000
      #
      # Key（只配你用的 Provider）
      # - OPENAI_API_KEY=...
      # - GEMINI_API_KEY=...
      # - ANTHROPIC_API_KEY=...
      # - ANTHROPIC_VERSION=2023-06-01
      #
      # 若要在网页里临时切换（自用可选，不建议对外站点开启）
      # - AI_CLIENT_OVERRIDES=true

volumes:
  bookmark-data:
