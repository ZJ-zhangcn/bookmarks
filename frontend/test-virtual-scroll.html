<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟滚动测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .info-panel {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7c3aed;
        }
        .test-container {
            height: 600px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        .bookmark-card {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            height: 120px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bookmark-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.12);
        }
        .bookmark-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .bookmark-desc {
            font-size: 0.875rem;
            opacity: 0.7;
            flex: 1;
        }
        .bookmark-url {
            font-size: 0.75rem;
            opacity: 0.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background: #6d28d9;
        }
        .virtual-scroll-wrapper {
            position: relative;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .virtual-scroll-content {
            position: relative;
            width: 100%;
        }
        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }
        .virtual-grid {
            position: absolute;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-panel">
            <h2>🚀 虚拟滚动性能测试</h2>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">总书签数</span>
                    <span class="stat-value" id="totalItems">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">渲染的 DOM 节点</span>
                    <span class="stat-value" id="renderedNodes">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">可见范围</span>
                    <span class="stat-value" id="visibleRange">0-0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="fps">60</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="generateData(100)">生成 100 条</button>
            <button onclick="generateData(500)">生成 500 条</button>
            <button onclick="generateData(1000)">生成 1000 条</button>
            <button onclick="generateData(5000)">生成 5000 条</button>
            <button onclick="scrollToTop()">回到顶部</button>
            <button onclick="scrollToBottom()">滚动到底部</button>
        </div>

        <div class="test-container" id="testContainer"></div>
    </div>

    <script type="module">
        import { createVirtualScroll } from './modules/virtual-scroll.js';

        let vsInstance = null;
        let lastFrameTime = performance.now();
        let frameCount = 0;

        function generateMockData(count) {
            const data = [];
            for (let i = 0; i < count; i++) {
                data.push({
                    id: `bookmark-${i}`,
                    name: `书签 ${i + 1}`,
                    description: `这是第 ${i + 1} 个书签的描述，用于测试虚拟滚动性能。`.repeat(Math.floor(Math.random() * 3) + 1),
                    url: `https://example.com/page-${i + 1}`
                });
            }
            return data;
        }

        function renderBookmarkCard(item) {
            const div = document.createElement('div');
            div.className = 'bookmark-card';
            div.innerHTML = `
                <div class="bookmark-name">${item.name}</div>
                <div class="bookmark-desc">${item.description}</div>
                <div class="bookmark-url">${item.url}</div>
            `;
            return div;
        }

        function updateStats() {
            if (!vsInstance) return;

            const totalItems = vsInstance.items.length;
            const renderedNodes = document.querySelectorAll('.bookmark-card').length;
            const visibleRange = `${vsInstance.visibleStart}-${vsInstance.visibleEnd}`;

            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('renderedNodes').textContent = renderedNodes;
            document.getElementById('visibleRange').textContent = visibleRange;

            // 计算 FPS
            frameCount++;
            const now = performance.now();
            if (now - lastFrameTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFrameTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastFrameTime = now;
            }

            requestAnimationFrame(updateStats);
        }

        window.generateData = function(count) {
            const data = generateMockData(count);

            if (vsInstance) {
                vsInstance.unmount();
            }

            const container = document.getElementById('testContainer');
            container.innerHTML = '';

            vsInstance = createVirtualScroll({
                container: container,
                itemHeight: 140,
                bufferSize: 2,
                renderItem: renderBookmarkCard
            });

            vsInstance.mount(container);
            vsInstance.setItems(data);

            console.log(`✅ 已生成 ${count} 条测试数据`);

            if (frameCount === 0) {
                updateStats();
            }
        };

        window.scrollToTop = function() {
            if (vsInstance) {
                vsInstance.scrollToTop('smooth');
            }
        };

        window.scrollToBottom = function() {
            if (vsInstance) {
                vsInstance.scrollToIndex(vsInstance.items.length - 1, 'smooth');
            }
        };

        // 初始化
        generateData(100);
    </script>
</body>
</html>
